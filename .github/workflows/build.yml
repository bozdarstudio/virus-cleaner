name: Build Virus Cleaner APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UNSIGNED_CI: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: unzip -o project.zip -d . && rm -f project.zip
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: false
      - name: Build release APK
        run: |
          flutter build apk --release
      - name: Verify native libs STORED
        run: |
          python3 - <<'PYEOF'
          import zipfile, sys
          apk = 'build/app/outputs/flutter-apk/app-release.apk'
          z = zipfile.ZipFile(apk)
          sos = [i for i in z.infolist()
                 if i.filename.startswith('lib/') and i.filename.endswith('.so')]
          bad = [i.filename for i in sos if i.compress_type != 0]
          print(f'native .so entries: {len(sos)}')
          for name in bad:
            print(f'NOT STORED (compress_type != 0): {name}')
          if not sos:
            print('FAIL: no native .so entries found in APK')
            sys.exit(1)
          if bad:
            print('FAIL: native libs must be STORED (legacy packaging)')
            sys.exit(1)
          print('OK: all native libs STORED')
          PYEOF
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VirusCleaner-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Upload APK to release v1.0.0
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk VirusCleaner-v1.0.0.apk
          gh release upload v1.0.0 VirusCleaner-v1.0.0.apk --clobber
