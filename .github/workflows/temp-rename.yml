name: Temp Rename

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename uploaded zip to project.zip
        run: mv project-viruscleaner-v110.zip project.zip
      - name: Commit rename
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add project.zip project-viruscleaner-v110.zip
          git commit -m "Rename uploaded zip to project.zip"
          git push
